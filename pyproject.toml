[project]
name = "ha-homepod-sensor-link"
version = "0.1.2"
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["custom_components/homepod_sensor_link"]

[tool.coverage.report]
exclude_lines = []
show_missing = true
skip_covered = true
precision = 2
fail_under = 100

[tool.mypy]
strict = true
python_version = "3.14"
incremental = false
follow_imports = "silent"
follow_untyped_imports = true
files = ["custom_components/homepod_sensor_link"]
