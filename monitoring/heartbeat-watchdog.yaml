blueprint:
  name: HomePod Sensor Link heartbeat
  description: Alert after selected HomePod Sensor Link diagnostic sensors stop completing checks for 15 minutes. Temperature value changes are not heartbeats.
  domain: automation
  input:
    monitored_entities:
      name: Sensor access diagnostic entities
      selector:
        entity:
          multiple: true
          domain: sensor
variables:
  monitored_entities: !input monitored_entities
triggers:
  - trigger: time_pattern
    minutes: "/5"
conditions:
  - condition: template
    value_template: >-
      {{ as_timestamp(now()) - as_timestamp(this.last_changed, 0) >= 900 }}
actions:
  - variables:
      stalled: >-
        {% set ns = namespace(entities=[]) %}
        {% for entity in monitored_entities %}
          {% if as_timestamp(now()) - as_timestamp(state_attr(entity, 'last_checked'), 0) >= 900 %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}
  - choose:
      - conditions: "{{ stalled | count > 0 }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: HomePod Sensor Link monitoring has stalled
              message: >-
                No completed check has been reported in at least 15 minutes for:
                {{ stalled | join(', ') }}.
              notification_id: homepod_sensor_link_watchdog
    default:
      - action: persistent_notification.dismiss
        data:
          notification_id: homepod_sensor_link_watchdog
mode: single
max_exceeded: silent
