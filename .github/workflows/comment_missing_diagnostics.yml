name: Missing Diagnostic Evidence Guidance
'on':
  issues:
    types:
    - opened
    - reopened
    - edited
    - labeled
    - unlabeled
  workflow_dispatch:
    inputs:
      item_number:
        description: Optional issue/PR number for a read-only preview; blank previews up to 100 open items
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  metadata:
    if: ${{ github.repository == 'barneyonline/ha-homepod-sensor-link' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: main
    - name: Exercise event policy with disposable fixtures
      run: docker run --rm --network none -v "$PWD:/project:ro" -w /project node:24-bookworm-slim node --test tests/automation/issue_automation.test.cjs
    - name: Preview manually; reconcile only the event item
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ github.token }}
        script: 'const {run} = require("./scripts/issue_automation.cjs");

          await run({github, context, core, mode: "diagnostics"});

          '
