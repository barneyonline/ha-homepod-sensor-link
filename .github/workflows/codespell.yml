name: Codespell and workflow checks
'on':
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch: {}
  schedule:
  - cron: 43 4 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Spelling, actionlint and metadata automation regressions
      run: sh scripts/validate_automation.sh
