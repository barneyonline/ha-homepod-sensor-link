name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      readiness:
        description: Gate to enforce after local validation
        type: choice
        default: local
        options: [local, platinum, release]
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require full public-content audit
        run: python3 scripts/check_public_content.py --history --require-git
      - name: Offline matrix, coverage, repository contracts and formatting
        id: local_validation
        env:
          HSL_REPORT_DIR: ${{ runner.temp }}/homepod-link-validation
        run: sh scripts/validate.sh
      - name: Require complete Platinum evidence when requested
        if: ${{ inputs.readiness == 'platinum' || inputs.readiness == 'release' }}
        run: >-
          docker run --rm --network none -v "$PWD:/project:ro" -w /project --entrypoint python
          homepod-link-quality:2026.11.0 scripts/validate_quality_scale.py --require-complete
      - name: Require independent release evidence when requested
        if: ${{ inputs.readiness == 'release' }}
        run: >-
          docker run --rm --network none -v "$PWD:/project:ro" -w /project --entrypoint python
          homepod-link-quality:2026.11.0 scripts/validate_quality_scale.py --require-release-ready
      - name: Preserve synthetic coverage evidence
        if: ${{ always() && steps.local_validation.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homepod-link-coverage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homepod-link-validation/
          if-no-files-found: error
          retention-days: 7
  codecov:
    name: Codecov
    needs: validate
    if: ${{ github.repository == 'barneyonline/ha-homepod-sensor-link' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run's validated coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homepod-link-coverage-${{ github.run_attempt }}
          path: coverage
      - name: Upload Python integration coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: barneyonline/ha-homepod-sensor-link
          files: coverage/2026.10.0/coverage.xml,coverage/2026.11.0/coverage.xml
          disable_search: true
          disable_file_fixes: true
          disable_safe_directory: true
          disable_telem: true
          plugins: noop
          cleanup: true
          fail_ci_if_error: true
